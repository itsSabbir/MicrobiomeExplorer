name: R-CMD-check

on:
  push:
    branches: [main]
    paths:
      - R/**
      - tests/**
      - man/**
      - vignettes/**
      - data/**
      - inst/**
      - DESCRIPTION
      - NAMESPACE
      - LICENSE
      - .Rbuildignore
      - .github/workflows/R-CMD-check.yml
  pull_request:
    branches: [main]
    paths:
      - R/**
      - tests/**
      - man/**
      - vignettes/**
      - data/**
      - inst/**
      - DESCRIPTION
      - NAMESPACE
      - LICENSE
      - .Rbuildignore
      - .github/workflows/R-CMD-check.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Prepare R dependency cache
        id: r-version
        run: |
          set -eu
          echo "R_LIBS_USER=${RUNNER_TEMP}/R-library" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/R-library"
          version="$(Rscript -e 'cat(as.character(getRversion()))')"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache R dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/R-library
          key: r-${{ runner.os }}-${{ steps.r-version.outputs.version }}-bioc-3.20-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            r-${{ runner.os }}-${{ steps.r-version.outputs.version }}-bioc-3.20-

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libglpk-dev libcurl4-openssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly=TRUE)) install.packages('remotes', repos='https://cloud.r-project.org')"
          Rscript -e "remotes::install_deps('.', dependencies=TRUE, repos=BiocManager::repositories())"
          Rscript -e "if (!requireNamespace('rcmdcheck', quietly=TRUE)) install.packages('rcmdcheck', repos='https://cloud.r-project.org')"

      - name: Check
        run: Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual'), error_on = 'error')"
